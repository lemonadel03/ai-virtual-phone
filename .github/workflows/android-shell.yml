name: Build Float Android APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "要加载的自部署站点地址（https://…）"
        required: false
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUAWEI_AGCONNECT_CONFIG_BASE64: ${{ secrets.HUAWEI_AGCONNECT_CONFIG_BASE64 }}
      SHELL_KEYSTORE_BASE64: ${{ secrets.SHELL_KEYSTORE_BASE64 }}
      SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_KEYSTORE_PASSWORD }}
      SHELL_KEY_ALIAS: ${{ secrets.SHELL_KEY_ALIAS }}
      SHELL_KEY_PASSWORD: ${{ secrets.SHELL_KEY_PASSWORD }}
      SHELL_SITE_URL: ${{ inputs.site_url || vars.SHELL_SITE_URL || 'https://float-lemonadel03.netlify.app/' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Restore private Android build inputs
        run: |
          test -n "$HUAWEI_AGCONNECT_CONFIG_BASE64" || { echo 'Missing HUAWEI_AGCONNECT_CONFIG_BASE64'; exit 1; }
          test -n "$SHELL_KEYSTORE_BASE64" || { echo 'Missing SHELL_KEYSTORE_BASE64'; exit 1; }
          test -n "$SHELL_KEYSTORE_PASSWORD" || { echo 'Missing SHELL_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$SHELL_KEY_ALIAS" || { echo 'Missing SHELL_KEY_ALIAS'; exit 1; }
          test -n "$SHELL_KEY_PASSWORD" || { echo 'Missing SHELL_KEY_PASSWORD'; exit 1; }
          echo "$HUAWEI_AGCONNECT_CONFIG_BASE64" | base64 -d > android-shell/app/agconnect-services.json
          echo "$SHELL_KEYSTORE_BASE64" | base64 -d > /tmp/shell.keystore
          echo "SHELL_KEYSTORE_FILE=/tmp/shell.keystore" >> "$GITHUB_ENV"

      - name: Build signed APK
        run: gradle -p android-shell assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: float-huawei-release
          path: android-shell/app/build/outputs/apk/release/*.apk
