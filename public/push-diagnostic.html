<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Float 通知诊断</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; padding: 28px 20px; box-sizing: border-box; background: #f6f7f7; color: #172225; }
    main { max-width: 440px; margin: 5vh auto; padding: 24px; border-radius: 22px; background: white; box-shadow: 0 12px 36px #15272d16; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { line-height: 1.6; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; margin: 24px 0; }
    dt { color: #53656b; }
    dd { margin: 0; font-weight: 600; text-align: right; }
    button { width: 100%; padding: 13px; border: 0; border-radius: 13px; background: #176b77; color: white; font: inherit; font-weight: 600; }
    button:disabled { opacity: .55; }
    #result { min-height: 1.6em; }
    a { color: #176b77; }
  </style>
</head>
<body>
  <main>
    <h1>Float 通知诊断</h1>
    <p>此测试只让当前手机显示一条本机通知，不经过 Supabase、Google 推送或 VPN。</p>
    <dl>
      <dt>网站通知权限</dt><dd id="permission">检查中…</dd>
      <dt>个人推送脚本</dt><dd id="worker">检查中…</dd>
      <dt>个人推送订阅</dt><dd id="subscription">检查中…</dd>
    </dl>
    <button id="test" type="button" disabled>显示本机测试通知</button>
    <p id="result" role="status" aria-live="polite"></p>
    <p><a href="/">返回 Float</a></p>
  </main>
  <script>
    const field = (id, value) => { document.getElementById(id).textContent = value; };
    let notificationRegistration = null;

    async function inspect() {
      field('permission', 'Notification' in window ? Notification.permission : '浏览器不支持');
      if (!('serviceWorker' in navigator)) {
        field('worker', '浏览器不支持');
        field('subscription', '不可用');
        return;
      }
      try {
        const personal = await navigator.serviceWorker.getRegistration('/personal-push/');
        notificationRegistration = personal || await navigator.serviceWorker.getRegistration('/');
        field('worker', personal ? '已注册' : '未注册');
        const subscription = personal ? await personal.pushManager.getSubscription() : null;
        field('subscription', subscription ? '已创建' : '未创建');
        document.getElementById('test').disabled = !('Notification' in window)
          || Notification.permission !== 'granted' || !notificationRegistration;
      } catch (error) {
        field('worker', '检查失败');
        field('subscription', '无法确认');
        field('result', error instanceof Error ? error.message : String(error));
      }
    }

    document.getElementById('test').addEventListener('click', async () => {
      const button = document.getElementById('test');
      button.disabled = true;
      field('result', '正在请求手机显示通知…');
      try {
        await notificationRegistration.showNotification('Float 本机通知测试', {
          body: '这条通知不经过云端或 Google 推送。',
          icon: '/icon-192.png',
          tag: `float-local-test-${Date.now()}`,
        });
        field('result', '浏览器已接受请求；请查看通知栏是否出现「Float 本机通知测试」。');
      } catch (error) {
        field('result', `本机通知失败：${error instanceof Error ? error.message : String(error)}`);
      } finally {
        button.disabled = false;
      }
    });

    void inspect();
  </script>
</body>
</html>
